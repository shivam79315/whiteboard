version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: whiteboard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: whiteboard
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: